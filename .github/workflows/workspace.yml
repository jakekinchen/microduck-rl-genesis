name: workspace-tools
on:
  push:
  pull_request:
jobs:
  read-only-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_duck_workspace.py
      - run: python tests/test_active_workspace.py
      - run: python tests/test_workspace_exchange.py
      - run: python -m unittest discover -s tests -p test_experiment_ops.py -v
