name: workspace-tools
on:
  push:
  pull_request:
jobs:
  read-only-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify workspace tooling
        run: python scripts/verify_workspace.py --json-out .workspace/verification.json
      - name: Retain verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-verification
          path: .workspace/verification.json
